<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            line-height: 1.56;
        }
        html{
            font-family: "Roboto", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #6A11CB, #2575FC);
        }

        section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .buttons {
            width: 350px;
            display: flex;
            justify-content: center;
            gap: 80px;
        }

        #btn1,#btn2 {
            width: 120px;
            padding: 8px;
            border-radius: 4rem;
            color: white;
            letter-spacing: 1.5px;
            font-weight: 700;
            font-size:1rem;
            margin-bottom: 13px;
            transition: all 0.5s linear;
        }

        #btn1 {
            background-color: #6A11CB;  
        }
        #btn1:hover{
            background-color: #8B3DFF;
        }

        #btn2 {
            background-color: burlywood;
        }
        #btn2:hover {
            background-color: #4D8DFF;
        }

        :is(#btn1, #btn2):hover {
            /* box-shadow: 0 0 2px 1px black; */
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .copiedDiv {
            width: 350px;
            height: 100px;
            border-left: 4px solid white;
            padding: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            box-shadow: 0 0 1px 0.2px;
            margin-top: 18px;
        }
        h2{
            color:orange;
            font-family: "Urbanist", sans-serif;
            font-style: italic;
            font-weight: 800;
            text-transform: capitalize;
            margin-bottom: 2rem;
            letter-spacing: 2px;;
        }
        h3 {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <section>
        <h2>Choose your Gradient Color</h2>
        <div class="buttons">
            <button id="btn1">#6A11CB</button>
            <button id="btn2">#2575FC</button>
        </div>
        <h3>Wanna Copy this color</h3>
        <div class="copiedDiv">
            background-image: linear-gradient(to right, #6A11CB, #2575FC)
        </div>
    </section>

    <script>
        let btn1 = document.getElementById("btn1");
        let btn2 = document.getElementById("btn2");
        let copiedDiv = document.querySelector(".copiedDiv");

        let rgbCode = "0123456789ABCDEF";
        const gradientChanger = () => {
            let hexCodes = "#";
            for (let i = 0; i < 6; i++) {
                let hexRandom = rgbCode[Math.floor(Math.random() * 16)];
                hexCodes = hexCodes + hexRandom;
            }
            return hexCodes;
        };

        let rgb1 = "#6A11CB";
        let rgb2 = "#2575FC";

        const handleEvents1 = () => {
            rgb1 = gradientChanger();
            console.log(rgb1);
            document.body.style.backgroundImage = ` linear-gradient(to right, ${rgb1}, ${rgb2})`;
            btn1.innerText = `${rgb1}`;
            copiedDiv.innerText=`background-image: linear-gradient(to right, ${rgb1}, ${rgb2})`;
        };

        const handleEvents2 = () => {
            rgb2 = gradientChanger();
            document.body.style.backgroundImage = ` linear-gradient(to right, ${rgb1}, ${rgb2})`;
            btn2.innerText = `${rgb2}`;
            copiedDiv.innerText=`background-image: linear-gradient(to right, ${rgb1}, ${rgb2})`;
        };

        btn1.addEventListener("click", handleEvents1);
        btn2.addEventListener("click", handleEvents2);

        copiedDiv.addEventListener("click", ()=>{
            navigator.clipboard.writeText(copiedDiv.innerText);
            alert("Text is copied");
        });
    </script>
</body>

</html>
