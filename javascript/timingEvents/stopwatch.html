<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop watch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 62.5%;
            color: #fff;
        }
        
        body {
            height: 100vh;
            background-color: sienna;
            display:grid;
            place-items: center;
        }
        .displayStopValue{
            color:rgb(196, 12, 196);
            text-align: center;
            font-size: 2rem;
            overflow: hidden;
        }
        .container{
            width:30rem;
            height:50rem;
            background-color: black;
            border-radius: 5rem;
            padding:12px;
            border:2rem solid red;

            .timer{
                display: grid;
                place-items: center;
                font-size:10rem;
                color:rgb(196, 12, 196);
            }
        }

        button{
            border-radius: 4rem;
            font-size:2rem;
            transition:all 0.4s linear;
            
            
            &:hover{
                border:2px solid yellow;
                color:yellow;
                background-color: transparent;
                cursor:pointer;
            }
        }
        
        .grid-3-rows{
            display: grid;
            grid-template-rows: repeat(3,1fr);
            gap:1rem;
        }

        .grid-2-columns{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:2rem;
        }
       
    </style>
</head>
<body>
    <section>
        <div class="container  grid-3-rows">
            <p class="timer">0</p>
            <div class="grid-2-columns">
                <button class="startBtn">Start</button>
                <button class="resetBtn">Reset</button>
                <button class="stopBtn">Stop</button>
                <button class="getTimeBtn">getTime</button>
                <button class="clearScreenBtn">clearScreen</button>
            </div>
            <div class="displayStopValue"></div>
        </div>
    </section>

    <script>
        const startBtn=document.querySelector(".startBtn");
        const resetBtn=document.querySelector(".resetBtn");
        const stopBtn=document.querySelector(".stopBtn");
        const getTimeBtn=document.querySelector(".getTimeBtn");
        const clearScreenBtn=document.querySelector(".clearScreenBtn");
        const displayStopValue=document.querySelector(".displayStopValue");
        const timer=document.querySelector(".timer");

        let startValue=0;
        let intervalId;

        const startTimer=()=>{
            if(intervalId) return; // if the timer is already started then dont start again
            intervalId=setInterval(()=>{
                timer.innerText=startValue++;
            },1000);
        };
        
        const resetTimer=()=>{
            clearInterval(intervalId);
            intervalId=null; // if(intervalId) return sees the old ID as truthy and prevents a new interval from being created.
            startValue=0;
            timer.innerText= startValue;
        };

        const stopTimer=()=>{
            clearInterval(intervalId);
            intervalId=null; // we can give null as well both gave falsy value
        };

        const getTimeValue=()=>{
            let para=document.createElement("p");
            displayStopValue.append(para);
            
            
            if(startValue === 0){
                para.innerText="Timer is not started yet";
            }else{
                para.innerText=`The stop value is ${timer.innerText}`;
            }
            //scrollHeight- How much space all the content needs
            //clientHeight- How much space the container actually has
            if(displayStopValue.scrollHeight > displayStopValue.clientHeight){
                displayStopValue.innerHTML="";
                displayStopValue.append(para);
            }
         
        };

        const clearScreen=()=>{
            displayStopValue.innerHTML="";
        };


        startBtn.addEventListener("click",startTimer);
        resetBtn.addEventListener("click",resetTimer);
        stopBtn.addEventListener("click",stopTimer);
        getTimeBtn.addEventListener("click",getTimeValue);
        clearScreenBtn.addEventListener("click",clearScreen);

        
    </script>
</body>
</html>
