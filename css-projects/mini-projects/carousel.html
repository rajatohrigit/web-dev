    <title>Carousel project</title>
    
    <style>
    /* A carousel is a component that shows multiple items one at a time or in a row, 
    and you can move through them using previous/next buttons  
    Which one should you learn/use?
    For content images → <img> ✅
    For background/design images → background-image ✅ */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    } 

    html {
        font-size: 10px;
    }

    body {
        height: 100vh;
        background-color: black;
        display: grid;
        place-items: center;
    }

    .container-img {
        width: 60vw;
        height: 40rem;
        border-radius: 1rem;
        box-shadow: 10px 10px 30px 4px rgb(64, 61, 167);
        animation: imagechange 12s linear infinite;
        background-size:100% 100%;
    }
