<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar-ellipse</title>
</head>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height:100vh;
            display: grid;
            place-items: center;
            background-color:red;
        }
        .universe{
            width:40vh;
            aspect-ratio: 1;
            background-color: yellow;
            border-radius:12px;
            display: grid;
            place-items:center;
            animation:bgchange 10s ease-in-out infinite;
        }

        .sun{
            width:27vh;
            aspect-ratio: 1;
            background-color: orange;
            border-radius:50%;  
            position:relative;
            overflow:hidden;
        }

        .sun:before{
            content:"";
            width:27vh;
            aspect-ratio: 1;
            background-color: black;
            border-radius:50%; 
            position: absolute; 
            animation:sun-move 10s ease-in-out infinite;
            
        }
        @keyframes sun-move {
            0%{
                translate:100%;
                scale:1;
            }
            50%{
                translate:0%;
                scale:0.94;
            }
            100%{
                translate:-100%;
                scale:1;
            }
        }
        @keyframes bgchange {
            0%{
                background-color:yellow ;
            }
            50%{
                background-color:black;
            }
            100%{
                background-color:yellow;
            }
        }

</style>
<body>
    <div class="universe">
        <div class="sun"></div>
    </div>
</body>
</html>
