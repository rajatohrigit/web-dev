<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-reveal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        body{
            height:100vh;
            display: grid;
            place-items: center;
            background-color:black;
        }
        h1{
            color:white;
            text-transform: uppercase;
            font-size:96px;
            position:relative;
        }
        h1::before{
            content:"Subscribe....";
            position:absolute;
            top:0;
            left:0;
            color:yellow;
            overflow:hidden;
            border-right:3px solid yellow;
            animation:text-reveal 3s linear infinite;
        }
        @keyframes text-reveal {
            0%{
                width:0%;
            }
            50%{
                width:100%;
            }
            100%{
                width:0%
            }
        }
    </style>
</head>
<body>
    <h1>Subscribe....</h1>
</body>
</html>
