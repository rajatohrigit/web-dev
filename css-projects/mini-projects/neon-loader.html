<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neonloader </title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html{
            font-size:10px;
        }
        body{
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            background-color:black;
        }
        
        .loader{
            width:20rem;
            height:20rem;
            background-color:red;
            border-radius: 50%;
            position: relative;
            /* display: grid;
            justify-content: end; */
            animation:loader 2s  linear infinite reverse ;
        }
        .loader::before{
            content:"";
            width:16rem;
            height:17rem;
            background-color:black;
            border-radius: 50%;
            position:absolute;
            top:0;
            left:0;
        }
        .loader::after{
            content:"";
            width:5rem;
            height:5rem;
            background-color: red;
            box-shadow: 0 0 2rem 1rem red ;
            border-radius:50%;
            position: absolute;
            top:-2.3rem;
            left:5rem;
        }
        @keyframes loader {
            /* 0%{
                rotate:0deg;
            } */
            100%{
                rotate:360deg;
            }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
</body>
</html>
